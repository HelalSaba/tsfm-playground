[project]
name = "tsfm-playground"
version = "0.1.0"
description = "TSFM Playground: A modular python environment for developing and ablating differnet components of time series foundation models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "einops>=0.8.2",
    "numpy>=2.4.6",
    "pre-commit>=4.6.0",
    "ruff>=0.15.17",
    "torch>=2.12.0",
    "jupyter",
    "matplotlib>=3.11.0",
]

[tool.ruff]
line-length = 120

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playground"]
